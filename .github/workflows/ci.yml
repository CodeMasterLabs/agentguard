name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo test
      # Prebuilt release: compiling cargo-near needs libudev (Ledger support) and ~10 min.
      - name: Install cargo-near
        env:
          CARGO_NEAR_VERSION: "0.22.0"
        run: |
          base="https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}"
          file="cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/$file.sha256" | awk 'NF {print $1"  '"$file"'"}' | sha256sum -c -
          tar -xzf "$file"
          install -m 0755 "$(find . -name cargo-near -type f | head -1)" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - run: cargo near build non-reproducible-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: agentguard-wasm
          path: contract/target/near/agentguard.wasm

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

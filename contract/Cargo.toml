[package]
name = "agentguard"
version = "0.1.0"
edition = "2021"
description = "Spending firewall for AI agents on NEAR: policy-checked, attestation-gated, human-approvable payments"
license = "MIT"
repository = "https://github.com/CodeMasterLabs/agentguard"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
